name: Computer Cultural Artifacts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  culture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate cultural seed records
        run: python3 tools/culture.py
      - name: Run cultural seed regression tests
        run: python3 -m unittest tests.test_culture -v
      - name: Validate broader computer-culture records
        run: python3 tools/computer_culture.py
      - name: Run broader computer-culture regression tests
        run: python3 -m unittest tests.test_computer_culture -v
      - name: Validate Australian governance culture records
        run: python3 tools/australian_culture.py
      - name: Run Australian governance culture regression tests
        run: python3 -m unittest tests.test_australian_culture -v
      - name: Parse cultural JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for root in (Path('culture'),):
              for path in root.rglob('*.json'):
                  json.loads(path.read_text(encoding='utf-8'))
                  print(path)
          for path in (
              Path('ai/cultural-artifact-policy.json'),
              Path('ai/computer-cultural-artifact-profile.json'),
              Path('ai/cultural-recovery-score.json'),
              Path('ai/australian-governance-policy.json'),
          ):
              json.loads(path.read_text(encoding='utf-8'))
              print(path)
          PY
